services:
  onward-translator:
    build: .
    container_name: onward-translator
    ports:
      # 与同机富润康 faq-chatbot 的 8000 错开
      - "${APP_PORT:-8010}:8000"
    volumes:
      # 密钥与限额：只放服务器，不进 Git
      - ./config.json:/app/config.json:ro
      # Whisper 模型缓存：首次启动自动下载，之后复用
      - ./models:/app/models
      # 任务产物持久化
      - ./jobs:/app/jobs
    environment:
      WHISPER_MODEL: /app/models/whisper-small
      PORT: "8000"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
