services:
  onward-translator:
    build: .
    container_name: onward-translator
    ports:
      # 与同机富润康 faq-chatbot 的 8000 错开
      - "${APP_PORT:-8010}:8000"
    env_file:
      - .env
    volumes:
      # 管理后台等可选配置；翻译密钥优先走环境变量 / GitHub Secrets
      - ./config.json:/app/config.json:ro
      # Whisper 模型缓存：首次启动自动下载，之后复用
      - ./models:/app/models
      # 任务产物持久化
      - ./jobs:/app/jobs
      # 可选：浏览器导出的 cookies（bilibili.txt / youtube.txt），用于突破站点风控
      - ./cookies:/app/cookies
    environment:
      WHISPER_MODEL: /app/models/whisper-small
      PORT: "8000"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_MT_ENDPOINT: ${ALIYUN_MT_ENDPOINT:-mt.aliyuncs.com}
      ALIYUN_SOURCE_LANG: ${ALIYUN_SOURCE_LANG:-auto}
    restart: unless-stopped
