name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          envs: ALIYUN_ACCESS_KEY_ID,ALIYUN_ACCESS_KEY_SECRET
          script: |
            set -e
            if [ ! -d ~/onward-translator/.git ]; then
              git clone https://github.com/yunitechhk2025/onward-translator.git ~/onward-translator
            fi
            cd ~/onward-translator
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f config.json ]; then
              cp config.example.json config.json
              echo "WARN: config.json 使用示例模板（管理后台等）；翻译密钥请用 GitHub Secrets"
            fi
            # 由 GitHub Secrets 注入；未配置则为空 → 应用自动降级 Google
            umask 077
            cat > .env <<EOF
            ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
            ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
            EOF
            # 去掉 heredoc 可能带入的前导空格
            sed -i 's/^[[:space:]]*//' .env
            mkdir -p models jobs cookies
            docker compose up -d --build
            docker compose ps
